id: https://w3id.org/omics-skills/project-metadata
name: project_metadata
title: Project metadata records
description: Linked sample, sequencing-run, file, result, and provenance records.
version: 1.0.0
license: MIT
prefixes:
  linkml: https://w3id.org/linkml/
  omics: https://w3id.org/omics-skills/project-metadata/
default_prefix: omics
default_range: string
imports:
  - linkml:types

enums:
  PlatformEnum:
    description: Sequencing platform family used for a run.
    permissible_values:
      ILLUMINA:
      PACBIO:
      NANOPORE:
  FileRoleEnum:
    description: Role of a file in the analysis graph.
    permissible_values:
      RAW_READS:
      INTERMEDIATE:
      RESULT:

classes:
  MetadataBundle:
    tree_root: true
    description: One validated project metadata snapshot.
    attributes:
      samples:
        description: Biological samples represented in this snapshot.
        range: Sample
        multivalued: true
        inlined_as_list: true
        required: true
      runs:
        description: Sequencing runs linked to samples.
        range: SequencingRun
        multivalued: true
        inlined_as_list: true
        required: true
      files:
        description: Raw, intermediate, and result files linked to runs.
        range: DataFile
        multivalued: true
        inlined_as_list: true
        required: true
      results:
        description: Analysis results linked to their input and output files.
        range: AnalysisResult
        multivalued: true
        inlined_as_list: true
        required: true
      provenance:
        description: Tool and command records linked to analysis results.
        range: ProvenanceRecord
        multivalued: true
        inlined_as_list: true
        required: true

  Sample:
    description: A biological sample collected for sequencing.
    attributes:
      sample_id:
        description: Stable project identifier for the sample.
        identifier: true
        required: true
        pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
      organism:
        description: Organism or community label assigned to the sample.
        required: true
      collection_date:
        description: Calendar date on which the sample was collected.
        range: date
        required: true

  SequencingRun:
    description: One sequencing run performed on a sample.
    attributes:
      run_id:
        description: Stable project identifier for the sequencing run.
        identifier: true
        required: true
        pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
      sample_id:
        description: Identifier of the sample used for this run.
        required: true
      platform:
        description: Sequencing platform family.
        range: PlatformEnum
        required: true
      instrument:
        description: Instrument model or recorded instrument name.
        required: true

  DataFile:
    description: A file recorded as an input, intermediate, or result.
    attributes:
      file_id:
        description: Stable project identifier for the file.
        identifier: true
        required: true
        pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
      run_id:
        description: Identifier of the sequencing run associated with the file.
        required: true
      path:
        description: Project-relative path to the file.
        required: true
      role:
        description: Role of the file in the analysis graph.
        range: FileRoleEnum
        required: true
      size_bytes:
        description: File size in bytes.
        range: integer
        minimum_value: 1
        required: true
      sha256:
        description: Lowercase SHA-256 digest of the file contents.
        pattern: ^[0-9a-f]{64}$
        required: true

  AnalysisResult:
    description: A derived result with explicit input and output files.
    attributes:
      result_id:
        description: Stable project identifier for the result.
        identifier: true
        required: true
        pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
      result_type:
        description: Project-defined class of analysis result.
        required: true
      input_file_ids:
        description: Ordered identifiers of files consumed by the analysis.
        multivalued: true
        required: true
      output_file_id:
        description: Identifier of the file produced by the analysis.
        required: true

  ProvenanceRecord:
    description: Tool invocation that produced one analysis result.
    attributes:
      provenance_id:
        description: Stable project identifier for the provenance record.
        identifier: true
        required: true
        pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
      result_id:
        description: Identifier of the result produced by this invocation.
        required: true
      tool:
        description: Tool or workflow name.
        required: true
      tool_version:
        description: Exact tool or workflow version.
        required: true
      command:
        description: Reproducible command with secrets represented by variable names.
        required: true
